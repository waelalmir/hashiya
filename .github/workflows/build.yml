name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  app:
    name: التطبيق
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: تطبيق update.zip إن وُجد في جذر المستودع
        run: |
          if [ -f update.zip ]; then
            unzip -o -q update.zip -x '.github/*' 'update.zip'
            echo "تم تطبيق update.zip"
          fi
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.35.3', channel: stable, cache: true }
      - name: إنشاء مجلد android إذا ناقص
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name hashiya --org com.hashiya .
          fi
      - run: python3 tools/patch_android.py
      - name: مفتاح توقيع ثابت (يسمح بالتحديث فوق النسخة القديمة)
        run: |
          mkdir -p ~/.android
          cp tools/debug.keystore ~/.android/debug.keystore
      - name: خط ستيكرات الورق (Playpen Sans Arabic) من Google Fonts
        run: |
          curl -fsSL -o /tmp/pp.ttf "https://github.com/google/fonts/raw/main/ofl/playpensansarabic/PlaypenSansArabic%5Bwght%5D.ttf" && cp /tmp/pp.ttf assets/fonts/PlaypenSansArabic.ttf && echo "تم تنزيل الخط" || echo "تعذر تنزيل الخط - يُستخدم الخط الاحتياطي"
      - run: flutter pub get
      - name: أيقونة التطبيق
        run: dart run flutter_launcher_icons
        continue-on-error: true
      - name: بناء APK
        run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=BUILD_ID=${{ github.run_number }}-$(git rev-parse --short HEAD)
      - uses: actions/upload-artifact@v4
        with:
          name: hashiya-app
          path: build/app/outputs/flutter-apk/app-release.apk

  ocr:
    name: نسخة OCR أوفلاين (تجريبية)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: تطبيق update.zip إن وُجد في جذر المستودع
        run: |
          if [ -f update.zip ]; then
            unzip -o -q update.zip -x '.github/*' 'update.zip'
            echo "تم تطبيق update.zip"
          fi
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.35.3', channel: stable, cache: true }
      - name: إنشاء مجلد android إذا ناقص
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name hashiya --org com.hashiya .
          fi
      - run: python3 tools/patch_android.py
      - name: مفتاح توقيع ثابت
        run: |
          mkdir -p ~/.android
          cp tools/debug.keystore ~/.android/debug.keystore
      - name: خط ستيكرات الورق
        run: |
          curl -fsSL -o /tmp/pp.ttf "https://github.com/google/fonts/raw/main/ofl/playpensansarabic/PlaypenSansArabic%5Bwght%5D.ttf" && cp /tmp/pp.ttf assets/fonts/PlaypenSansArabic.ttf && echo "تم تنزيل الخط" || echo "تعذر تنزيل الخط"
      - name: تفعيل محرك OCR (Tesseract) وتنزيل بيانات العربية
        run: |
          cp lib/
