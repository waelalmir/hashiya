name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Create android platform if missing
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --platforms=android --project-name hashiya --org com.hashiya .
            rm -f test/widget_test.dart
          fi

      - run: python3 tools/patch_android.py
      - run: flutter pub get

      - name: Check icon files
        run: ls -la assets/icon/ || echo "assets/icon folder is MISSING"

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
        continue-on-error: true

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: hashiya-app
          path: build/app/outputs/flutter-apk/app-release.apk
